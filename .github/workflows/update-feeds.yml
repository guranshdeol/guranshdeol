name: Update videos and posts
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
jobs:
  build:
    name: Pull latest YouTube videos and Hashnode posts into the README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Latest YouTube videos
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?playlist_id=UULF-Z9VvWUZUq7SNZbaAENnvA"
          comment_tag_name: "YOUTUBE"
          max_post_count: 3
          commit_message: "Update latest videos"
      - name: Latest Hashnode posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://guranshdeol.hashnode.dev/rss.xml"
          comment_tag_name: "BLOG"
          max_post_count: 3
          commit_message: "Update latest posts"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh the health-check terminal
        run: |
          node scripts/health-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/health-check.svg
          git diff --cached --quiet || (git commit -m "Update health check" && git push)
