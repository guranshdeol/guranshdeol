<svg xmlns="http://www.w3.org/2000/svg" width="860" height="408" viewBox="0 0 860 408" role="img" aria-label="Health check: Guransh Deol, Consultant at Nutanix. NCM-MCI, 10 Nutanix certifications. From Punjab, working in Bengaluru. Latest video: AI Distillation Explained. Open to opportunities.">
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #e6edf3; white-space: pre; }
    .ln { opacity: 0; animation: show .2s ease-out forwards; }
    .cmd { clip-path: inset(0 100% 0 0); animation: type 1.6s steps(58) forwards; }
    .cursor { opacity: 0; animation: show .01s forwards 6.06s, blink 1.1s steps(1) infinite 6.06s; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln, .cursor { opacity: 1; animation: none; }
      .cmd { clip-path: none; animation: none; }
    }
  </style>
  <rect x="0.5" y="0.5" width="859" height="407" rx="10" fill="#0d1117" stroke="#30363d"/>
