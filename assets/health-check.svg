  <text x="24" y="202" class="ln" style="animation-delay:3.52s"><tspan>[ </tspan><tspan fill="#3fb950" font-weight="700">PASS</tspan><tspan> ] clusters left healthier .... all of them</tspan></text>
  <text x="24" y="225" class="ln" style="animation-delay:3.84s"><tspan>[ </tspan><tspan fill="#d29922" font-weight="700">WARN</tspan><tspan> ] side project ............... AI agent asks before every fix</tspan></text>
